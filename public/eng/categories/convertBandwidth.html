<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/unit_conversion.css">
    <link rel="icon" href="../../img/CM.png" type="image/png">
    <link rel="alternate" hreflang="ca" href="../../cat/categories/convertBandwidth.html">
    <link rel="alternate" hreflang="en" href="../../eng/categories/convertBandwidth.html">
    <link rel="alternate" hreflang="pt" href="../../por/categories/convertBandwidth.html">
    <link rel="alternate" hreflang="fr" href="../../fra/categories/convertBandwidth.html">
    <link rel="alternate" hreflang="es" href="../../esp/categories/convertBandwidth.html">
    <title>Convertmon - Bandwidth</title>

</head>

<body>
    <header>

        <nav class="languages">
            <a href="../../cat/categories/convertBandwidth.html">Català</a>
            <a href="../../eng/categories/convertBandwidth.html">English</a>
            <a href="../../por/categories/convertBandwidth.html">Português</a>
            <a href="../../fra/categories/convertBandwidth.html">Français</a>
            <a href="../../esp/categories/convertBandwidth.html">Español</a>
        </nav>

        <div class="title">
            <h1><a href="../index_eng.html">CONVERTMON</a></h1>
        </div>

        <div class="title_family">
            <h2>BANDWIDTH</h2>
        </div>

    </header>

    <div class="father">

        <main>

            <form id="converterForm">

                <input type="number" id="text" step="any" inputmode="decimal">
                <br>
                <select name="bandwidth1" id="bandwidth1"></select>

                <label for="text">to</label>

                <select name="bandwidth2" id="bandwidth2"></select>

                <button id="button" type="submit">Convert</button>

            </form>

            <div id="results"></div>

            <div id="image1">
                <img src="../../img/img1.jpg" alt="Units of measurement" width="650" height="200"
                    loading="lazy">
            </div>

        </main>

        <div class="column">
            <aside id="lateral">
                <nav>
                    <ul id="menu">
                        <li><a class="units" href="convertArea.html">Area</a></li>
                        <li><a class="units" href="convertBandwidth.html">Bandwidth</a></li>
                        <li><a class="units" href="convertComputerDataStorage.html">Data storage</a></li>
                        <li><a class="units" href="convertElectricCurrent.html">Electric current</a>
                        <li><a class="units" href="convertEnergy.html">Energy</a></li>
                        <li><a class="units" href="convertForce.html">Force</a></li>
                        <li><a class="units" href="convertLength.html">Length</a></li>
                        <li><a class="units" href="convertMass.html">Mass</a></li>
                        <li><a class="units" href="convertPressure.html">Pressure</a></li>
                        <li><a class="units" href="convertSpeed.html">Speed</a></li>
                        <li><a class="units" href="convertTemperature.html">Temperature</a></li>
                        <li><a class="units" href="convertTime.html">Time</a></li>
                        <li><a class="units" href="convertVoltage.html">Voltage</a></li>
                        <li><a class="units" href="convertVolume.html">Volume</a></li>
                    </ul>
                </nav>
            </aside>

            <div id="image2">
                <img src="../../img/img2.jpg" alt="Units of measurement" width="250" height="450"
                    loading="lazy">
            </div>
        </div>

    </div>

    <footer>

        <a href="../policy_eng.html">Legal Info</a>
        <a href="../policy_eng.html">Cookie Policy</a>

    </footer>

    <script>

        document.getElementById("converterForm").addEventListener("submit", e => { e.preventDefault(); check(); });

        let units = [];
        let translations = {};

        // Carrega el JSON de llenguatge
        fetch("../../../data/lang_eng.json")
            .then(r => r.json())
            .then(data => { translations = data.units; });

        // Carrega el JSON
        fetch("../../../data/units_data.json")
            .then(r => r.json())
            .then(data => {
                units = data; // guarda el JSON globalment

                // Filtra només les unitats de categoria "bandwidth"
                const bandwidthUnits = data.filter(x => x.category === "bandwidth");

                // Extreu els noms únics
                const unitNames = [...new Set(bandwidthUnits.map(x => x.from))];

                unitNames.sort();

                const select1 = document.getElementById("bandwidth1");
                const select2 = document.getElementById("bandwidth2");

                unitNames.forEach(u => {
                    select1.innerHTML += `<option value="${u}">${translations[u]}</option>`;
                    select2.innerHTML += `<option value="${u}">${translations[u]}</option>`;
                });
            });


        function check() {

            const unit1 = document.getElementById("bandwidth1").value;
            const unit2 = document.getElementById("bandwidth2").value;

            const value = parseFloat(document.getElementById("text").value);

            if (isNaN(value)) {
                document.getElementById("results").innerHTML = "Please, enter a valid number.";
                return;
            }

            const entry = units.find(x => x.from === unit1 && x.to === unit2);

            if (!entry) {
                document.getElementById("results").innerHTML = "Conversion not found.";
                return;
            }

            const factor = entry.factor;
            const offset = entry.offset || 0;

            const result = value * factor + offset;

            document.getElementById("results").innerHTML =
                `${value} ${translations[unit1].toUpperCase()} = ${result} ${translations[unit2].toUpperCase()}`;
        }

    </script>
</body>

</html>
